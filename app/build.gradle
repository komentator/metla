plugins {
    id "com.android.application"
}

android {
    namespace "com.example.metaldetector"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.example.metaldetector"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1"

        // MapKit API key from local.properties (not in git)
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        buildConfigField "String", "MAPKIT_API_KEY", "\"${localProperties.getProperty('mapkit.api.key', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    dependencies {
        implementation 'org.osmdroid:osmdroid-android:6.1.18'
        implementation 'androidx.core:core:1.12.0'
        implementation('com.yandex.android:maps.mobile:4.6.1-full') {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
    }
}
